name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="$PUSH_TAG"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Android versionName
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "Unable to read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Release tag version ($EXPECTED_VERSION) does not match app versionName ($APP_VERSION)." >&2
            exit 1
          fi
          echo "Version check passed: $APP_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build release candidate
        run: ./gradlew --no-daemon clean test assembleDebug

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          APK="CareerOpsShare-${TAG}-debug.apk"
          SHA="${APK}.sha256"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$SHA"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA: ${{ steps.assets.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --target "$GITHUB_SHA" \
              --title "CareerOps Share $TAG" \
              --generate-notes
          fi
