name: Android Release
run-name: Release ${{ inputs.tag }} — preflight + signed publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.1. Read docs/RELEASE_CHECKLIST.md first.'
        required: true
        type: string
      confirm_pr_merged:
        description: 'I confirm the release candidate changes are merged into main.'
        required: true
        default: false
        type: boolean
      confirm_device_validation:
        description: 'I confirm the signed release candidate was installed and smoke-tested on a physical device.'
        required: true
        default: false
        type: boolean
      confirm_validation_recorded:
        description: 'I confirm VALIDATION.md records the result for this exact version.'
        required: true
        default: false
        type: boolean
      confirm_main_ci:
        description: 'I confirm the newest Android CI run on main is green.'
        required: true
        default: false
        type: boolean
      confirm_stable_signing:
        description: 'I confirm the signed RC used the permanent CareerOps release key and its signer fingerprint was verified.'
        required: true
        default: false
        type: boolean
      confirm_checklist_reviewed:
        description: 'I reviewed docs/RELEASE_CHECKLIST.md and the release notes/changelog.'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Preflight, build, verify, and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify human release confirmations
        shell: bash
        env:
          CONFIRM_PR_MERGED: ${{ inputs.confirm_pr_merged }}
          CONFIRM_DEVICE_VALIDATION: ${{ inputs.confirm_device_validation }}
          CONFIRM_VALIDATION_RECORDED: ${{ inputs.confirm_validation_recorded }}
          CONFIRM_MAIN_CI: ${{ inputs.confirm_main_ci }}
          CONFIRM_STABLE_SIGNING: ${{ inputs.confirm_stable_signing }}
          CONFIRM_CHECKLIST_REVIEWED: ${{ inputs.confirm_checklist_reviewed }}
        run: |
          declare -A CHECKS=(
            ["Release candidate changes merged into main"]="$CONFIRM_PR_MERGED"
            ["Signed physical-device smoke validation completed"]="$CONFIRM_DEVICE_VALIDATION"
            ["VALIDATION.md updated for this release"]="$CONFIRM_VALIDATION_RECORDED"
            ["Android CI on main is green"]="$CONFIRM_MAIN_CI"
            ["Permanent release signer fingerprint verified"]="$CONFIRM_STABLE_SIGNING"
            ["Release checklist and notes reviewed"]="$CONFIRM_CHECKLIST_REVIEWED"
          )

          FAILED=0
          for LABEL in "${!CHECKS[@]}"; do
            if [ "${CHECKS[$LABEL]}" != "true" ]; then
              echo "Release confirmation missing: $LABEL" >&2
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Complete docs/RELEASE_CHECKLIST.md, then start a new release run." >&2
            exit 1
          fi

          echo "All human release confirmations passed."

      - name: Verify workflow is running from current main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Android Release must be started with 'Use workflow from: main'." >&2
            echo "Current ref: $GITHUB_REF" >&2
            exit 1
          fi

          git fetch origin main --quiet
          HEAD_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse origin/main)

          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "Checked-out commit is not the current origin/main." >&2
            echo "HEAD:        $HEAD_SHA" >&2
            echo "origin/main: $MAIN_SHA" >&2
            exit 1
          fi

          echo "main preflight passed: $HEAD_SHA"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          TAG="$MANUAL_TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            echo "Expected form: vX.Y.Z, for example v0.2.1" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Android version and validation record
        id: android_version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release_tag.outputs.version }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$APP_VERSION" ]; then
            echo "Unable to read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "Unable to read a numeric versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Release tag version ($EXPECTED_VERSION) does not match app versionName ($APP_VERSION)." >&2
            exit 1
          fi

          if ! grep -Fq "## v${EXPECTED_VERSION}" VALIDATION.md; then
            echo "VALIDATION.md does not contain a section for v${EXPECTED_VERSION}." >&2
            echo "Complete validation and update VALIDATION.md before release." >&2
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to a different commit." >&2
              echo "Tag commit:     $TAG_SHA" >&2
              echo "Release commit: $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Existing tag $TAG already points to this release commit."
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version preflight passed: versionName=$APP_VERSION versionCode=$VERSION_CODE tag=$TAG"

      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CAREEROPS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CAREEROPS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAREEROPS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAREEROPS_RELEASE_KEY_PASSWORD }}
        run: |
          FAILED=0
          for NAME in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Missing required stable-signing secret backing $NAME" >&2
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Configure the repository signing secrets documented in docs/SIGNING.md." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Materialize temporary signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CAREEROPS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CAREEROPS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAREEROPS_RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/careerops-share-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Write preflight summary
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          VERSION: ${{ steps.release_tag.outputs.version }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          {
            echo "## CareerOps Share release preflight"
            echo
            echo "- ✅ Source ref: \`main\`"
            echo "- ✅ Current main commit: \`$GITHUB_SHA\`"
            echo "- ✅ Release tag: \`$TAG\`"
            echo "- ✅ Android versionName: \`$VERSION\`"
            echo "- ✅ Android versionCode: \`$VERSION_CODE\`"
            echo "- ✅ Human confirmations complete"
            echo "- ✅ VALIDATION.md contains this release version"
            echo "- ✅ Stable signing secrets are present and keystore opens"
            echo
            echo "Full process: [docs/RELEASE_CHECKLIST.md](../../blob/main/docs/RELEASE_CHECKLIST.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build signed release APK
        env:
          CAREEROPS_RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          CAREEROPS_RELEASE_STORE_PASSWORD: ${{ secrets.CAREEROPS_RELEASE_STORE_PASSWORD }}
          CAREEROPS_RELEASE_KEY_ALIAS: ${{ secrets.CAREEROPS_RELEASE_KEY_ALIAS }}
          CAREEROPS_RELEASE_KEY_PASSWORD: ${{ secrets.CAREEROPS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean test assembleRelease

      - name: Verify APK signature
        id: verify
        shell: bash
        run: |
          set -o pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "Signed release APK was not produced at $APK" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-verification.txt
          CERT_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-verification.txt | head -n 1)

          if [ -z "$CERT_SHA256" ]; then
            echo "Unable to read signer SHA-256 fingerprint from apksigner output." >&2
            exit 1
          fi

          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          APK="CareerOpsShare-${TAG}.apk"
          SHA="${APK}.sha256"
          CERT="CareerOpsShare-${TAG}-signing-certificate.txt"

          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$SHA"
          {
            echo "CareerOps Share $TAG"
            echo "Signer certificate SHA-256: $CERT_SHA256"
            echo "Source commit: $GITHUB_SHA"
          } > "$CERT"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA: ${{ steps.assets.outputs.sha }}
          CERT: ${{ steps.assets.outputs.cert }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" "$CERT" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" "$CERT" \
              --target "$GITHUB_SHA" \
              --title "CareerOps Share $TAG" \
              --generate-notes
          fi

      - name: Write release completion summary
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA: ${{ steps.assets.outputs.sha }}
          CERT: ${{ steps.assets.outputs.cert }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          {
            echo
            echo "## Signed release published"
            echo
            echo "- ✅ GitHub Release: \`$TAG\`"
            echo "- ✅ Signed APK: \`$APK\`"
            echo "- ✅ SHA-256 file: \`$SHA\`"
            echo "- ✅ Signing certificate record: \`$CERT\`"
            echo "- 🔐 Signer SHA-256: \`$CERT_SHA256\`"
            echo
            echo "Complete the post-release verification section in docs/RELEASE_CHECKLIST.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/careerops-share-release.p12"
