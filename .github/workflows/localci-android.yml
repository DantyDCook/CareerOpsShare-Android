# Generated by LocalCI publisher/enroll.py. Update the manifest and regenerate.
name: LocalCI Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected checkout SHA
        type: string
        required: false

permissions:
  contents: read

jobs:
  android:
    if: github.repository_owner == 'DantyDCook' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, local-ci, hyperv-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit tests, lint and unsigned Android artifacts
        id: build
        env:
          PROFILE: "{\"gradle\": \"9.6.0\", \"gradle_heap_mb\": 2048, \"gradle_workers\": 1, \"tasks\": [\"testDebugUnitTest\", \"testReleaseUnitTest\", \"lintDebug\", \"lintRelease\", \"assembleDebug\", \"bundleRelease\"], \"properties\": [\"localciProtectedUnsignedBundle=true\", \"kotlin.compiler.execution.strategy=in-process\"], \"stage_scripts\": [], \"post_scripts\": [], \"version_property\": \"localciVersionCode\", \"name_property\": \"localciVersionName\"}"
          PIN: "sha256:248d6dc390ef33e06c8978cde2793348dc0d9e5c21c945e89119d721e88492bc"
          REPOSITORY_MANIFEST: "true"
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PIN" =~ ^sha256:[0-9a-f]{64}$ ]]
          image=localci-android-builder:installed
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$PIN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ -n "$EXPECTED_SHA" ]]; then test "$EXPECTED_SHA" = "$GITHUB_SHA"; fi
          if [[ "$REPOSITORY_MANIFEST" == true ]]; then
            manifest=localci/android.json
            git ls-tree HEAD -- "$manifest" | grep -Eq '^100(644|755) blob '
            [[ "$(git cat-file -s "HEAD:$manifest")" -le 32768 ]]
            PROFILE="$(git cat-file blob "HEAD:$manifest")"
            MANIFEST_HASH="$(git cat-file blob "HEAD:$manifest" | sha256sum | cut -d' ' -f1)"
            printf 'Source %s LocalCI manifest %s SHA-256 %s\n' "$GITHUB_SHA" "$manifest" "$MANIFEST_HASH"
            echo "LOCALCI_MANIFEST_SHA256=$MANIFEST_HASH" >> "$GITHUB_ENV"
          fi
          export PROFILE
          cache=$(mktemp -d "$RUNNER_TEMP/android-gradle.XXXXXXXX")
          docker run --rm --pull=never --cpus=2 --memory=6g --memory-swap=6g             --pids-limit=512 --cap-drop=ALL --security-opt=no-new-privileges --read-only             --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g --user "$(id -u):$(id -g)"             -e HOME=/tmp -e GRADLE_USER_HOME=/gradle-cache -e JAVA_TOOL_OPTIONS=-Duser.home=/tmp             -e PROFILE -e GITHUB_REPOSITORY -e REPOSITORY_MANIFEST -v "$GITHUB_WORKSPACE:/workspace" -v "$cache:/gradle-cache"             -w /workspace -i "$image" python3 - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess, zipfile
          p = json.loads(os.environ["PROFILE"])
          assert p["gradle"] in ("8.11.1", "9.6.0")
          if os.environ["REPOSITORY_MANIFEST"] == "true":
              allowed = {
                  "schema_version", "app", "repository", "branch", "package", "version",
                  "gradle", "gradle_workers", "gradle_heap_mb", "version_property", "name_property",
                  "properties", "stage_scripts", "post_scripts", "offline", "native_libraries",
                  "asset_hashes", "instrumentation_required", "hosted_publisher", "track",
                  "compile_sdk", "jdk_major", "wrapper_gradle", "release_cadence_minutes",
                  "release_window_utc"
              }
              assert not p.keys() - allowed and p["schema_version"] == 1
              assert p["repository"] == os.environ["GITHUB_REPOSITORY"] and p["branch"] == "main"
              assert p["track"] == "internal" and p["compile_sdk"] == 36 and p["jdk_major"] == 17
              assert type(p["instrumentation_required"]) is bool
              assert re.fullmatch(r"[A-Za-z][\w]*(?:\.[A-Za-z][\w]*)+", p["package"])
              assert all(re.fullmatch(r"[A-Za-z][A-Za-z0-9_.-]*", p[k])
                         for k in ("version_property", "name_property"))
              pins = {p["version_property"], p["name_property"]}
              assert len(pins) == 2
              for key, default in (("gradle_workers", 1), ("gradle_heap_mb", 2048)):
                  p.setdefault(key, default)
              assert type(p["gradle_workers"]) is int and 1 <= p["gradle_workers"] <= 2
              assert type(p["gradle_heap_mb"]) is int and 512 <= p["gradle_heap_mb"] <= 3072
              for key in ("properties", "stage_scripts", "post_scripts"):
                  p.setdefault(key, [])
                  assert isinstance(p[key], list) and len(p[key]) <= 64
              assert all(re.fullmatch(r"[A-Za-z][A-Za-z0-9_.-]*=[A-Za-z0-9_.:-]+", entry)
                         and entry.split("=", 1)[0] not in pins for entry in p["properties"])
              for entry in p["stage_scripts"] + p["post_scripts"]:
                  f = Path(entry)
                  assert re.fullmatch(r"[A-Za-z0-9_./-]+", entry)
                  assert not entry.startswith(("/", "-")) and ".." not in f.parts and f.is_file()
                  assert f.resolve().is_relative_to(Path.cwd())
              p["tasks"] = ["testDebugUnitTest", "testReleaseUnitTest", "lintDebug", "lintRelease",
                            "assembleDebug", "bundleRelease"]
              if p["instrumentation_required"]:
                  p["tasks"].append("assembleDebugAndroidTest")
          for script in p["stage_scripts"]:
              path = Path(script)
              path.write_bytes(path.read_bytes().replace(b"\r\n", b"\n"))
              subprocess.run(["bash", script], check=True, timeout=900)
          subprocess.run([f"/opt/gradle-{p['gradle']}/bin/gradle", "--no-daemon",
                          f"--max-workers={p['gradle_workers']}", f"-Dorg.gradle.jvmargs=-Xmx{p['gradle_heap_mb']}m",
                          *p["tasks"], f"-P{p['version_property']}=1",
                          f"-P{p['name_property']}=0.0.0-ci",
                          *("-P" + entry for entry in p["properties"])], check=True, timeout=4500)
          for script in p["post_scripts"]:
              subprocess.run(["python3", script], check=True, timeout=180)
          with zipfile.ZipFile("app/build/outputs/bundle/release/app-release.aab") as bundle:
              assert not any(n.upper().startswith("META-INF/") and n.upper().endswith(
                  (".SF", ".RSA", ".DSA", ".EC")) for n in bundle.namelist()), "CI bundle must be unsigned"
          PY
      - name: Retain and verify CI archive
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" =~ ^DantyDCook/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]]
          root="$HOME/.local/share/localci/artifacts/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$root"
          dest="$root/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          stage=$(mktemp -d "$root/.incoming.XXXXXXXX")
          trap 'rm -r -- "$stage"' EXIT
          mkdir "$stage/payload"
          # Never follow a symlink supplied by repository code or the guest build.
          for dir in app app/build; do [[ ! -L "$dir" ]]; done
          if [ -d app/build ]; then test -z "$(find app/build -type l -print -quit)"; fi
          if [ -e CHANGELOG.md ]; then test -f CHANGELOG.md && test ! -L CHANGELOG.md; fi
          shopt -s nullglob
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab; do
            if [ "$BUILD_OUTCOME" = success ]; then test -s "$f"; fi
            if [ -s "$f" ]; then cp -- "$f" "$stage/payload/"; fi
          done
          for variant in testDebugUnitTest testReleaseUnitTest; do
            reports=(app/build/test-results/"$variant"/TEST-*.xml)
            if [ "$BUILD_OUTCOME" = success ]; then (( ${#reports[@]} )); fi
            for f in "${reports[@]}"; do
              install -D -m 600 -- "$f" "$stage/payload/$variant/${f##*/}"
            done
          done
          for f in app/build/reports/lint-results-{debug,release}.xml; do
            if [ "$BUILD_OUTCOME" = success ]; then test -s "$f"; fi
            if [ -s "$f" ]; then cp -- "$f" "$stage/payload/"; fi
          done
          for f in CHANGELOG.md app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ -f "$f" ]; then cp -- "$f" "$stage/payload/"; fi
          done
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\nbuild_outcome=%s\n'             "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$BUILD_OUTCOME" > "$stage/payload/PROVENANCE.txt"
          if [[ -n "${LOCALCI_MANIFEST_SHA256:-}" ]]; then
            git cat-file blob HEAD:localci/android.json > "$stage/payload/localci-android.json"
            test "$(sha256sum "$stage/payload/localci-android.json" | cut -d' ' -f1)" = "$LOCALCI_MANIFEST_SHA256"
            printf 'manifest_sha256=%s\n' "$LOCALCI_MANIFEST_SHA256" >> "$stage/payload/PROVENANCE.txt"
          fi
          (cd "$stage/payload" && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$stage/input-sums")
          mv -- "$stage/input-sums" "$stage/payload/SHA256SUMS.txt"
          tar -cf "$stage/artifacts.tar" -C "$stage/payload" .
          rm -r -- "$stage/payload"
          (cd "$stage" && sha256sum artifacts.tar > artifacts.tar.sha256)
          mv -T -n -- "$stage" "$dest"
          [[ ! -e "$stage" ]]
          readback=$(mktemp -d "$RUNNER_TEMP/android-readback.XXXXXXXX")
          trap 'rm -r -- "$readback"' EXIT
          (cd "$dest" && sha256sum -c artifacts.tar.sha256)
          tar -xf "$dest/artifacts.tar" -C "$readback"
          (cd "$readback" && sha256sum --check --strict SHA256SUMS.txt)
          printf 'Verified LocalCI archive: `%s` on `%s`\n' "$dest/artifacts.tar" "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
