name: Apply Manual Intake Patch

on:
  push:
    branches:
      - feature/v0.3.0-manual-intake
    paths:
      - tools/apply_manual_intake_patch.py
      - .github/workflows/manual-intake-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-manual-intake
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python tools/apply_manual_intake_patch.py

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/careerops/share/MainActivity.kt app/src/test/java/com/careerops/share/ShareParserTest.kt
          git commit -m "Add manual Share Review intake"
          git push origin HEAD:feature/v0.3.0-manual-intake
